<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minimal Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Minimal Bible</h1>
    <button id="openSearch">🔍</button>
    <button id="themeToggle">🌙</button>
    <button id="langToggle">EN + DE</button>
    <button onclick="undoHighlight()">↩</button>
  </header>

<!-- HOME SCREEN -->
<section id="homeScreen" class="screen active home">

  <!-- Greeting -->
  <div class="home-header">
    <div>
      <h1 id="greeting">Good Afternoon</h1>
      <p id="todayDate"></p>
    </div>
    <button class="icon-btn" id="quickTheme">☀️</button>
  </div>

  <!-- Verse of the Day -->
  <div class="card verse-card">
    <div class="card-header">
      <div class="icon yellow">✨</div>
      <h2>Verse of the Day</h2>
      <button class="icon-btn">🔗</button>
    </div>

    <div class="card-content">
      <small id="dailyVerseRef">Genesis 1:1</small>

      <p class="lang-label">English</p>
      <p id="dailyVerseText">Loading...</p>

      <hr />

      <p class="lang-label">Deutsch</p>
      <p id="dailyVerseTextDE">Loading...</p>
    </div>
  </div>

  <!-- Quick Access -->
  <h2 class="section-title">Quick Access</h2>

  <div class="quick-grid">
    <div class="quick-card blue" id="continueReading">
      <div class="quick-icon">📖</div>
      <h3>Continue Reading</h3>
      <p id="continueText">Start reading</p>
    </div>

    <div class="quick-card red" onclick="openFavoritesScreen()">
      <div class="quick-icon">❤️</div>
      <h3>Favorites</h3>
      <p><span id="favCount">0</span> saved</p>
    </div>

    <div class="quick-card green">
      <div class="quick-icon">🕒</div>
      <h3>Recent</h3>
      <p>Last read</p>
    </div>

    <div class="quick-card purple" onclick="openSearch()">
      <div class="quick-icon">🔍</div>
      <h3>Search</h3>
      <p>Find verses</p>
    </div>
  </div>

</section>



<!-- BIBLE SCREEN -->
<section id="bibleScreen" class="screen">

  <!-- FONT SIZE -->
  <div class="font-control">
    <span>A</span>
    <input type="range" id="fontSlider" min="14" max="24" value="18" />
    <span>A</span>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <select id="book"></select>
    <select id="chapter"></select>
  </div>

  <!-- VERSES -->
  <main id="verses" class="dual"></main>

</section>


  <!-- EVERYTHING RELATED TO BIBLE GOES HERE -->
  
  <!-- header -->
  <!-- font slider -->
  <!-- book & chapter selects -->
  <!-- verses -->
</section>

<!-- SETTINGS SCREEN -->
<section id="settingsScreen" class="screen">
  <h2>Settings</h2>

  <button id="themeToggleBtn">🌙 Dark / Light</button>
  <br /><br />
  <button id="langToggleBtn">🌐 Language</button>
</section>

  <!-- SEARCH SCREEN -->
  <section id="searchScreen" class="search-screen hidden">
    <input
      id="searchInput"
      type="text"
      placeholder="Search Bible"
      autocomplete="off"
    />
    <div id="searchResults"></div>
  </section>

  <!-- NOTES & FAVORITES SCREENS -->
  <section id="notesScreen" class="search-screen hidden"></section>
  <section id="favoritesScreen" class="search-screen hidden"></section>

  <!-- NOTE EDITOR (BOTTOM SHEET) -->
  <div id="noteEditor" class="note-editor hidden">
    <div class="note-sheet">
      <textarea id="noteText" placeholder="Write your note..."></textarea>
      <button id="saveNote">Save</button>
    </div>
  </div>

  <!-- HIGHLIGHT PALETTE -->
  <div id="highlightPalette" class="palette hidden">
    <div class="palette-colors">
      <span data-color="highlight-yellow"></span>
      <span data-color="highlight-green"></span>
      <span data-color="highlight-blue"></span>
      <span data-color="highlight-pink"></span>
    </div>
    <button id="clearHighlight">Clear</button>
  </div>

  <!-- PIXEL BOTTOM BAR -->
 <!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button id="navHome" class="nav-btn active">🏠</button>
  <button id="navBible" class="nav-btn">📖</button>
  <button id="navSettings" class="nav-btn">⚙️</button>
</nav>


  <!-- SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
