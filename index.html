<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minimal Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

  <!-- NOTE EDITOR (BOTTOM SHEET) -->
<div id="noteEditor" class="note-editor hidden">
  <div class="note-sheet">
    <textarea
      id="noteText"
      placeholder="Write your note..."
    ></textarea>
    <button id="saveNote">Save</button>
  </div>
</div>

  <!-- PIXEL BOTTOM BAR -->
<nav class="pixel-bar">
  <button class="pixel-btn active" id="navHome">🏠</button>
  <button class="pixel-btn" id="navSearch">🔍</button>
  <button class="pixel-btn" id="navTheme">🌙</button>
  <button class="pixel-btn" id="navNotes">📝</button>
</nav>

<body>

  <!-- HEADER -->
  <header>
    <h1>Minimal Bible</h1>
    <button id="openSearch">🔍</button>
    <button id="themeToggle">🌙</button>
    <button id="langToggle">EN + DE</button>
    <button onclick="undoHighlight()">↩</button>
  </header>
<div class="font-control">
  <span>A</span>
  <input
    type="range"
    id="fontSlider"
    min="14"
    max="24"
    value="18"
  />
  <span>A</span>
</div>

  <!-- CONTROLS -->
  <div class="controls">
    <select id="book"></select>
    <select id="chapter"></select>
  </div>

  <!-- VERSES -->
 <main id="verses" class="dual"></main>

  <!-- SEARCH SCREEN -->
  <section id="searchScreen" class="search-screen hidden">
    <input
      id="searchInput"
      type="text"
      placeholder="Search Bible"
      autocomplete="off"
    />
    <div id="searchResults"></div>
  </section>
<section id="notesScreen" class="search-screen hidden"></section>
<section id="favoritesScreen" class="search-screen hidden"></section>

  <!-- HIGHLIGHT PALETTE -->
  <div id="highlightPalette" class="palette hidden">
    <div class="palette-colors">
      <span data-color="highlight-yellow"></span>
      <span data-color="highlight-green"></span>
      <span data-color="highlight-blue"></span>
      <span data-color="highlight-pink"></span>
    </div>
    <button id="clearHighlight">Clear</button>
  </div>

  <!-- SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
