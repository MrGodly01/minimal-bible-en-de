<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minimal Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Minimal Bible</h1>
    <button id="openSearch">🔍</button>
    <button id="themeToggle">🌙</button>
    <button id="langToggle">EN + DE</button>
    <button onclick="undoHighlight()">↩</button>
  </header>

  <!-- FONT SIZE -->
  <div class="font-control">
    <span>A</span>
    <input type="range" id="fontSlider" min="14" max="24" value="18" />
    <span>A</span>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <select id="book"></select>
    <select id="chapter"></select>
  </div>

<!-- HOME SCREEN -->
<section id="homeScreen" class="screen active">
  <h2>Welcome 👋</h2>
  <p>Continue reading the Word</p>

  <button onclick="openBible()" class="home-btn">
    📖 Open Bible
  </button>
</section>

<!-- BIBLE SCREEN -->
<section id="bibleScreen" class="screen">
  <!-- EVERYTHING RELATED TO BIBLE GOES HERE -->
  
  <!-- header -->
  <!-- font slider -->
  <!-- book & chapter selects -->
  <!-- verses -->
</section>

<!-- SETTINGS SCREEN -->
<section id="settingsScreen" class="screen">
  <h2>Settings</h2>

  <button onclick="toggleTheme()">🌙 Dark / Light</button>
  <br /><br />
  <button onclick="toggleLanguage()">🌐 Language</button>
</section>

  <!-- VERSES -->
  <main id="verses" class="dual"></main>

  <!-- SEARCH SCREEN -->
  <section id="searchScreen" class="search-screen hidden">
    <input
      id="searchInput"
      type="text"
      placeholder="Search Bible"
      autocomplete="off"
    />
    <div id="searchResults"></div>
  </section>

  <!-- NOTES & FAVORITES SCREENS -->
  <section id="notesScreen" class="search-screen hidden"></section>
  <section id="favoritesScreen" class="search-screen hidden"></section>

  <!-- NOTE EDITOR (BOTTOM SHEET) -->
  <div id="noteEditor" class="note-editor hidden">
    <div class="note-sheet">
      <textarea id="noteText" placeholder="Write your note..."></textarea>
      <button id="saveNote">Save</button>
    </div>
  </div>

  <!-- HIGHLIGHT PALETTE -->
  <div id="highlightPalette" class="palette hidden">
    <div class="palette-colors">
      <span data-color="highlight-yellow"></span>
      <span data-color="highlight-green"></span>
      <span data-color="highlight-blue"></span>
      <span data-color="highlight-pink"></span>
    </div>
    <button id="clearHighlight">Clear</button>
  </div>

  <!-- PIXEL BOTTOM BAR -->
 <!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button id="navHome" class="nav-btn active">🏠</button>
  <button id="navBible" class="nav-btn">📖</button>
  <button id="navSettings" class="nav-btn">⚙️</button>
</nav>


  <!-- SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
